<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Locked In — Body</title>
<script src="topbar.js" defer></script>
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="ui.js"></script>
<style>
.measure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.m-tile {
  background: var(--bg-secondary); border: 1px solid var(--border-soft);
  border-radius: 12px; padding: 12px 14px;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.m-tile:hover { background: rgba(255,255,255,0.05); }
.m-tile.is-active { border-color: rgba(224,118,88,0.45); background: var(--accent-soft); }
.m-input-row { display: flex; gap: 6px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
.m-input-row .input { max-width: 150px; }
.m-label-active { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }

.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 14px; }
.photo-cell {
  position: relative; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border-soft);
  aspect-ratio: 3/4; background: var(--bg-secondary);
}
.photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-date {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 4px 8px;
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: #FAFAFA; background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
}
.photo-del {
  position: absolute; top: 6px; right: 6px;
  width: 24px; height: 24px; border-radius: 7px;
  border: none; background: rgba(0,0,0,0.55);
  color: #FAFAFA; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s;
}
.photo-cell:hover .photo-del { opacity: 1; }
.photo-note {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-quaternary);
  margin-top: 10px;
}
.viewer {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.88);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.viewer.show { display: flex; }
.viewer img { max-width: 100%; max-height: 92vh; border-radius: 12px; }
</style>
</head>
<body>

<main>
  <h1 class="dash-title">Body</h1>

  <!-- ====== Medidas ====== -->
  <div class="section-title">Composición y medidas</div>
  <div class="card">
    <div class="card-eyebrow" id="todayLabel">Hoy</div>
    <div class="card-title">Toca una medida para ver su evolución</div>
    <div class="card-sub">grasa mensual · cintura y medidas cuando quieras</div>

    <div class="measure-grid" id="mGrid" style="margin-top:14px"></div>

    <div class="m-input-row">
      <span class="m-label-active" id="mActiveLabel">—</span>
      <input class="input input-mono" id="mInput" type="number" min="0" step="0.1" placeholder="valor" inputmode="decimal">
      <button class="btn-primary" id="mSave">Guardar</button>
    </div>
  </div>

  <!-- ====== Evolución ====== -->
  <div class="section-title">Evolución</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
      <div>
        <div class="card-eyebrow" id="chartName">—</div>
        <div class="big-num" id="chartLatest">—</div>
        <div id="chartDelta" style="margin-top:4px"></div>
      </div>
      <div class="seg" id="rangeSeg">
        <button data-d="30">30D</button>
        <button data-d="90" class="is-active">90D</button>
        <button data-d="365">1A</button>
      </div>
    </div>
    <div class="chart-wrap" id="mChart" style="margin-top:14px"></div>
  </div>

  <!-- ====== Fotos de progreso ====== -->
  <div class="section-title">Fotos de progreso</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div>
        <div class="card-eyebrow">Galería</div>
        <div class="card-title" style="font-size:18px">Compárate con el tiempo</div>
      </div>
      <label class="btn-primary" style="cursor:pointer">
        + Añadir foto
        <input type="file" id="photoInput" accept="image/*" hidden>
      </label>
    </div>
    <div class="photo-grid" id="photoGrid"></div>
    <div class="photo-note">Las fotos se guardan SOLO en este dispositivo (no se sincronizan, son demasiado pesadas).</div>
  </div>

  <div class="attribution">Locked In · Body</div>
</main>

<div class="viewer" id="viewer"><img id="viewerImg" alt=""></div>

<script>
(function () {
  'use strict';
  const L = window.LIM;
  const $ = (id) => document.getElementById(id);

  const MEASURES = [
    { id: 'body_fat', name: 'Grasa corporal', unit: '%',  goodWhenUp: false },
    { id: 'waist',    name: 'Cintura',        unit: 'cm', goodWhenUp: false },
    { id: 'chest',    name: 'Pecho',          unit: 'cm', goodWhenUp: true },
    { id: 'arm',      name: 'Brazo',          unit: 'cm', goodWhenUp: true },
    { id: 'thigh',    name: 'Muslo',          unit: 'cm', goodWhenUp: true },
    { id: 'hips',     name: 'Cadera',         unit: 'cm' },
    { id: 'neck',     name: 'Cuello',         unit: 'cm' },
    { id: 'skinfold_sum', name: 'Σ Pliegues', unit: 'mm', goodWhenUp: false },
  ];
  let active = 'body_fat';
  let range = 90;

  /* ---------- IndexedDB para fotos ---------- */
  let idb = null;
  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('lim_body_photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => { idb = r.result; res(idb); };
      r.onerror = () => rej(r.error);
    });
  }
  function photosAll() {
    return new Promise((res) => {
      const out = [];
      const tx = idb.transaction('photos').objectStore('photos').openCursor();
      tx.onsuccess = (e) => {
        const c = e.target.result;
        if (c) { out.push(c.value); c.continue(); } else res(out.reverse());
      };
      tx.onerror = () => res(out);
    });
  }
  function photoAdd(rec) {
    return new Promise((res) => {
      const tx = idb.transaction('photos', 'readwrite');
      tx.objectStore('photos').add(rec);
      tx.oncomplete = res;
    });
  }
  function photoDel(id) {
    return new Promise((res) => {
      const tx = idb.transaction('photos', 'readwrite');
      tx.objectStore('photos').delete(id);
      tx.oncomplete = res;
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    $('todayLabel').textContent = 'Hoy — ' + L.fmtLong(L.activeDateKey());

    $('mGrid').addEventListener('click', (e) => {
      const t = e.target.closest('.m-tile'); if (!t) return;
      active = t.dataset.m; render();
    });
    $('mSave').addEventListener('click', saveMeasure);
    $('mInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveMeasure(); });
    $('rangeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      range = parseInt(b.dataset.d, 10);
      document.querySelectorAll('#rangeSeg button').forEach((x) => x.classList.toggle('is-active', x === b));
      render();
    });

    $('photoInput').addEventListener('change', onPhoto);
    $('viewer').addEventListener('click', () => $('viewer').classList.remove('show'));

    await openDB();
    render();
    renderPhotos();
    window.addEventListener('resize', render);
  });

  function saveMeasure() {
    const v = parseFloat($('mInput').value);
    if (isNaN(v) || v <= 0) return;
    L.metricLog('body', active, v);
    $('mInput').value = '';
    render();
  }

  async function onPhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    // Redimensiona a máx 1100px y comprime para no llenar el disco
    const img = await new Promise((res) => {
      const i = new Image();
      i.onload = () => res(i);
      i.src = URL.createObjectURL(file);
    });
    const MAX = 1100;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * scale);
    cv.height = Math.round(img.height * scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const dataUrl = cv.toDataURL('image/jpeg', 0.82);
    await photoAdd({ date: L.activeDateKey(), src: dataUrl, at: Date.now() });
    e.target.value = '';
    renderPhotos();
  }

  async function renderPhotos() {
    const list = await photosAll();
    if (!list.length) {
      $('photoGrid').innerHTML = '<div class="empty-state" style="grid-column:1/-1">Sin fotos aún — añade la primera para empezar a comparar.</div>';
      return;
    }
    $('photoGrid').innerHTML = list.map((p) => `
      <div class="photo-cell" data-id="${p.id}">
        <img src="${p.src}" alt="Progreso ${p.date}" loading="lazy">
        <button class="photo-del" title="Eliminar">×</button>
        <div class="photo-date">${L.fmtShort(p.date)}</div>
      </div>`).join('');
    $('photoGrid').querySelectorAll('.photo-cell').forEach((cell) => {
      cell.querySelector('img').addEventListener('click', () => {
        $('viewerImg').src = cell.querySelector('img').src;
        $('viewer').classList.add('show');
      });
      cell.querySelector('.photo-del').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('¿Eliminar esta foto?')) return;
        await photoDel(Number(cell.dataset.id));
        renderPhotos();
      });
    });
  }

  function render() {
    const m = MEASURES.find((x) => x.id === active);

    // tiles
    $('mGrid').innerHTML = MEASURES.map((x) => {
      const last = L.metricLatest('body', x.id, 365);
      return `<div class="m-tile ${x.id === active ? 'is-active' : ''}" data-m="${x.id}">
        <div class="stat-tile-label">${x.name}</div>
        <div class="stat-tile-value">${last ? last.value : '—'}<span class="unit"> ${x.unit}</span></div>
        <div class="stat-tile-sub">${last ? L.fmtShort(last.date) : 'sin datos'}</div>
      </div>`;
    }).join('');

    $('mActiveLabel').textContent = m.name + ' (' + m.unit + ')';
    $('mInput').placeholder = m.unit;

    // chart
    const series = L.metricSeries('body', active, range);
    const pts = series.filter((p) => p.value != null);
    const last = pts.length ? pts[pts.length - 1] : null;
    const first = pts.length ? pts[0] : null;
    $('chartName').textContent = m.name + ' · últimos ' + (range === 365 ? 'año' : range + ' días');
    $('chartLatest').innerHTML = (last ? last.value : '—') + ' <span class="unit">' + m.unit + '</span>';
    $('chartDelta').innerHTML = last && first && last !== first
      ? L.deltaHTML(last.value, first.value, { goodWhenUp: m.goodWhenUp })
      : '<span class="delta flat">—</span>';
    L.areaChart($('mChart'), series, { color: '#E07658', height: 160 });
  }
})();
</script>
</body>
</html>
